<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enroll - Skillify</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; cursor: pointer; }
    label { font-weight: bold; }
  </style>
</head>
<body>
  <h2>Enter Your Details</h2>

  <form id="enrollment-form">
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Your Name" required>

    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" required>

    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="10-digit mobile number" required>

    <button type="submit">Pay Now</button>
  </form>

  <script>
    document.getElementById('enrollment-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const student = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim()
      };

      sessionStorage.setItem('pendingStudent', JSON.stringify(student));
      window.location.href = 'thankyou.html';
    });
  </script>
</body>
</html>
